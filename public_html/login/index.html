<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lions Sports Club</title>

    <!-- Static favicon, matching /LOS and /signup. The three link elements this
         replaces carried ids for a script that set their href at runtime, and
         no such script was ever loaded on this page, so they resolved to
         nothing and the tab showed the browser default. -->
    <link rel="icon" type="image/png" href="/media/lsc_head_128.png">
    <link rel="apple-touch-icon" href="/media/lsc_head_128.png">

    <!-- League Spartan is the only web font this property loads. The two faces
         requested here previously are both named and forbidden by
         lions-tokens.css, and League Spartan was never fetched at all, so the
         ported header would have rendered in the Arial fallback. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <script src="https://lionsfundraising.com/universal-auth.js"></script>

    <script src="/js/lions-log.js?v=1"></script>
    <script src="/js/lions-access.js?v=1"></script>
    <script src="/js/lions-nav.js?v=2" defer></script>
    <script src="/js/lions-header-identity.js?v=1" defer></script>
    <link rel="stylesheet" href="/css/lions-tokens.css?v=1">
    <link rel="stylesheet" href="/css/lions-chrome.css?v=1">

    <style>
        /* --------------------------------------------------------------------
           Page-local surfaces for the sign-in card.

           There is deliberately no :root block here any more. The version this
           replaces declared its own --white, --gray-50 through --gray-900 and
           --font-primary on :root, and because a page style block comes after
           the stylesheet link it won that cascade against the token bridge in
           lions-chrome.css. Every ported chrome rule reading one of those names
           would have repainted, so the social section on this page would not
           have matched the identical markup on /signup.

           The spacing and radius aliases below are kept because the rules use
           them throughout, but they are scoped to the page class and resolve to
           the canonical scale rather than to a private copy of it. None of them
           is a name the bridge owns.
           ------------------------------------------------------------------ */

        .login-page {
            --space-1:  var(--lions-space-1);
            --space-2:  var(--lions-space-2);
            --space-3:  var(--lions-space-3);
            --space-4:  var(--lions-space-4);
            --space-6:  var(--lions-space-6);
            --space-8:  var(--lions-space-8);
            --space-12: var(--lions-space-12);

            --radius-md: var(--lions-radius);
            --radius-lg: var(--lions-radius-lg);
        }

        /* .page-bg supplies the Lions Blue rail, so the body background this
           page used to set is gone and the canon does the job. The shell only
           holds the gutter that used to live on body padding. */
        .login-shell {
            padding: var(--lions-space-6);
        }

        .main-container {
            max-width: 1600px;
            margin: 0 auto;
            background: var(--white);
            border: var(--lions-border);
            border-radius: var(--radius-lg);
            padding: var(--space-8);
            padding-top: var(--space-12);
            min-height: calc(100vh - var(--space-12));
        }

        .login-screen {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            text-align: center;
        }

        /* The card reads against the page by its blue rule, not by a tint. The
           previous #fafafa panel sat on pure white and was invisible on a phone
           at any brightness below full. */
        .login-container {
            background: var(--white);
            border: var(--lions-border-firm);
            border-radius: var(--radius-lg);
            padding: var(--space-12);
            max-width: 500px;
            width: 100%;
        }

        .login-header {
            margin-bottom: var(--space-8);
        }

        .login-title {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 600;
            line-height: 1.2;
            color: var(--blue-primary);
            margin-bottom: var(--space-4);
        }

        .login-subtitle {
            font-family: var(--font-body);
            color: var(--gray-mid);
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: var(--space-6);
        }

        .auth-options {
            margin-bottom: var(--space-6);
        }

        /* ---- Form --------------------------------------------------------- */

        .form-group {
            margin-bottom: var(--space-4);
            text-align: left;
        }

        .form-group label {
            display: block;
            font-family: var(--font-heading);
            font-weight: 600;
            color: var(--blue-primary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: var(--space-2);
        }

        .form-group input {
            width: 100%;
            min-height: var(--lions-tap-target);
            padding: var(--space-3);
            /* Room for the Show control, which is absolutely positioned over
               the right edge of the password field. */
            padding-right: 4.5rem;
            border: 1px solid var(--gray-border);
            border-radius: var(--radius-md);
            background: var(--white);
            color: var(--lions-ink);
            font-size: 1rem;
            font-family: var(--font-body);
            transition: border-color 0.2s;
        }

        /* The focus ring is an outline rather than the box-shadow this page
           used to draw, because the flat rule allows no shadow and an outline
           stays visible in forced-colors mode. */
        .form-group input:focus-visible {
            outline: var(--lions-focus-ring);
            outline-offset: var(--lions-focus-offset);
            border-color: var(--blue-primary);
        }

        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: var(--space-3);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-family: var(--font-heading);
            color: var(--gray-mid);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: var(--space-1);
        }

        .password-toggle:hover { color: var(--blue-primary); }
        .password-toggle:focus-visible {
            outline: var(--lions-focus-ring);
            outline-offset: var(--lions-focus-offset);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-2);
            width: 100%;
            min-height: var(--lions-tap-target);
            padding: var(--space-3) var(--space-4);
            background: var(--blue-primary);
            color: var(--white);
            border: none;
            border-radius: var(--radius-md);
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover  { background: var(--blue-hover); }
        .btn:active { background: var(--blue-active); }
        .btn:focus-visible {
            outline: var(--lions-focus-ring);
            outline-offset: var(--lions-focus-offset);
        }

        .btn:disabled {
            background: var(--gray-border);
            cursor: not-allowed;
        }

        /* ---- Status banner -------------------------------------------------
           The status colors come from the palette's AA-tuned set. The values
           this replaces (#10b981 success, #ef4444 error) fail AA for text on a
           light surface, which matters most here: the error banner is the only
           thing telling a volunteer why they cannot get in. */

        .login-status {
            padding: var(--space-3);
            margin: var(--space-4) 0;
            border-radius: var(--radius-md);
            font-weight: 500;
            display: none;
            text-align: left;
            line-height: 1.4;
            font-size: 0.875rem;
        }

        .login-status.success {
            background: var(--lions-success-bg);
            color: var(--lions-success);
            border: 1px solid var(--lions-success);
            display: block;
        }

        .login-status.error {
            background: var(--lions-error-bg);
            color: var(--lions-error);
            border: 1px solid var(--lions-error);
            display: block;
        }

        /* ---- Secondary links ----------------------------------------------- */

        .login-options {
            margin-top: var(--space-6);
            text-align: center;
        }

        .login-options a {
            display: inline-block;
            color: var(--blue-primary);
            font-weight: 500;
            /* A 44px line box so the two links are thumb-sized on a phone,
               which they were not at the previous inline height. */
            line-height: var(--lions-tap-target);
            margin: 0 var(--space-3);
            transition: color 0.2s;
        }

        .login-options a:hover {
            color: var(--blue-hover);
            text-decoration: underline;
        }

        .login-options a:focus-visible {
            outline: var(--lions-focus-ring);
            outline-offset: var(--lions-focus-offset);
        }

        /* ---- Responsive ----------------------------------------------------- */

        @media (max-width: 768px) {
            .login-shell   { padding: var(--lions-space-4); }
            .main-container {
                padding: var(--space-4);
                padding-top: var(--space-8);
                min-height: calc(100vh - var(--space-8));
            }
            .login-container { padding: var(--space-8); }
            .login-title     { font-size: 2rem; }
        }

        @media (max-width: 480px) {
            .login-container { padding: var(--space-6); }
            .login-title     { font-size: 1.75rem; }
        }
    </style>
</head>

<body class="login-page">
<div class="page-bg">

    <!-- Site header. Markup and navigation come from /js/lions-nav.js,
         the single definition on this property, mirroring $nav_items in
         /includes/header.php on lionssports.club. data-nav is empty because
         sign-in is not a navigation destination; it is where a volunteer is
         sent, so no row should read as the current page. -->
    <header id="site-header" data-nav=""></header>

    <main class="login-shell">
        <div class="main-container">
            <div class="login-screen">
                <div class="login-container">
                    <div class="login-header">
                        <h1 class="login-title">Welcome Back</h1>
                        <p class="login-subtitle">Sign in to access your Lions account</p>
                    </div>

                    <div class="auth-options">
                        <form id="loginForm">
                            <div class="form-group">
                                <label for="email">Email Address</label>
                                <input type="email" id="email" autocomplete="email" required>
                            </div>
                            <div class="form-group">
                                <label for="password">Password</label>
                                <div class="password-container">
                                    <input type="password" id="password" autocomplete="current-password" required>
                                    <button type="button" class="password-toggle" aria-pressed="false">
                                        Show
                                    </button>
                                </div>
                            </div>
                            <div class="form-group">
                                <button type="submit" class="btn">
                                    Sign In
                                </button>
                            </div>
                        </form>

                        <!-- Announced politely so a screen reader hears the
                             failure reason without losing the caret in the
                             field the volunteer is about to correct. -->
                        <div id="loginStatus" class="login-status" role="status" aria-live="polite"></div>

                        <div class="login-options">
                            <a href="/register">Create Account</a>
                            <a href="/forgot-password">Forgot Password?</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- ===== SOCIAL (ported from /includes/footer.php) ===================== -->
    <section class="social-section">
        <div class="container">
            <h2 class="section-heading" style="color: var(--white); margin-bottom: 0;">
                Social
                <hr class="hr-accent" style="background: var(--blue-hover);" />
            </h2>

            <div class="social-links">
                <a href="https://www.facebook.com/LionsHomeschoolFootball" target="_blank" rel="noopener" aria-label="Facebook">
                    <svg aria-hidden="true"><use href="/icons/social.svg#facebook" /></svg>
                </a>
                <a href="https://www.instagram.com/lionssports.club" target="_blank" rel="noopener" aria-label="Instagram">
                    <svg aria-hidden="true"><use href="/icons/social.svg#instagram" /></svg>
                </a>
                <a href="https://www.youtube.com/@LionsSportsClub2024" target="_blank" rel="noopener" aria-label="YouTube">
                    <svg aria-hidden="true"><use href="/icons/social.svg#youtube" /></svg>
                </a>
            </div>
        </div>
    </section>

    <!-- ===== FOOTER ========================================================
         The canon footer is copyright only. ================================ -->
    <footer class="footer-section">
        <div class="container">
            <p class="footer-copyright">
                Copyright &copy; 2026 Lions Sports Club. All Rights Reserved. &nbsp;
                <a href="https://lionssports.club">lionssports.club</a>
            </p>
        </div>
    </footer>

</div><!-- /page-bg -->

<script type="module">
    /**
     * /login page behaviour.
     *
     * Three changes from the version this replaces, all required by the
     * standards rather than by taste.
     *
     * The header is no longer set up from here. The frozen v1.9 universal
     * header script is gone, and the ported header renders itself from
     * lions-nav.js as soon as the shell element exists, so there is nothing to
     * await. The guarded branch that called its setup entry point never threw,
     * because it tested for the global first, but it was dead code that would
     * have read as a live dependency to the next person editing this file.
     *
     * Logging goes through LIONS_LOG, which is silent unless the URL carries
     * ?debug=1. The previous copy printed four unconditional console lines on
     * every load, including one that announced an authenticated session.
     *
     * The Show control is wired with addEventListener rather than an inline
     * onclick attribute. Inline handlers are flagged by the conformance
     * validator, cannot be reached by a content security policy, and forced a
     * function to be published on window purely so the markup could see it.
     */
    const LOG = window.LIONS_LOG || { log() {}, warn() {}, error() {} };

    let isProcessingLogin = false;

    document.addEventListener('DOMContentLoaded', () => {
        LOG.log('Login page initializing.');

        setupLoginForm();
        setupPasswordToggle();

        // Auth resolution is deliberately not awaited. A volunteer must be able
        // to type into the form while the SDK is still loading.
        initializeBackgroundSystems();

        LOG.log('Login page ready.');
    });

    async function initializeBackgroundSystems() {
        try {
            await checkExistingAuth();
        } catch (error) {
            LOG.warn('Background system initialization failed:', error);
            // Continue. The login form still works without it.
        }
    }

    async function checkExistingAuth() {
        try {
            await waitForAuth(3000);

            if (window.LIONS_AUTH && window.LIONS_AUTH.isAuthenticated()) {
                LOG.log('Session already active; redirecting.');
                showLoginStatus('success', 'Already logged in. Redirecting.');

                const redirectUrl = sessionStorage.getItem('lionsAuthRedirect') || '/dashboard';
                sessionStorage.removeItem('lionsAuthRedirect');

                setTimeout(() => {
                    window.location.replace(redirectUrl);
                }, 800);
            }
        } catch (error) {
            LOG.warn('Auth check failed:', error);
            // Continue. The login form still works without it.
        }
    }

    async function waitForAuth(timeoutMs = 3000) {
        const startTime = Date.now();

        while (Date.now() - startTime < timeoutMs) {
            if (window.LIONS_AUTH && window.LIONS_AUTH.isInitialized) {
                return true;
            }
            await new Promise(resolve => setTimeout(resolve, 100));
        }

        throw new Error('Auth system timeout');
    }

    function setupLoginForm() {
        const loginForm = document.getElementById('loginForm');
        if (loginForm) {
            loginForm.addEventListener('submit', handleEmailLogin);
        }
    }

    function setupPasswordToggle() {
        const toggleBtn = document.querySelector('.password-toggle');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', togglePasswordVisibility);
        }
    }

    async function handleEmailLogin(event) {
        event.preventDefault();

        if (isProcessingLogin) return;

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const submitBtn = event.target.querySelector('button[type="submit"]');
        const originalText = submitBtn.textContent;

        if (!email || !password) {
            showLoginStatus('error', 'Please enter both email and password.');
            return;
        }

        isProcessingLogin = true;

        try {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing in...';

            hideLoginStatus();

            await waitForAuth(5000);

            if (!window.LIONS_AUTH || !window.LIONS_AUTH.isInitialized) {
                throw new Error('Authentication system not available. Please refresh the page.');
            }

            const result = await window.LIONS_AUTH.signInWithEmailAndPassword(email, password);

            if (result.success) {
                // Universal auth owns the redirect on success.
                LOG.log('Sign-in succeeded.');
            } else {
                throw new Error(result.error || 'Login failed');
            }

        } catch (error) {
            // A failed sign-in is always printed. The message carries no
            // identifier, only the reason, so it is safe on a shared screen.
            LOG.error('Login error:', error);

            const errorMessages = {
                'auth/user-not-found': 'No account found with this email address.',
                'auth/wrong-password': 'Incorrect password. Please try again.',
                'auth/invalid-email': 'Invalid email address format.',
                'auth/too-many-requests': 'Too many failed attempts. Please wait and try again.',
                'auth/user-disabled': 'This account has been disabled.',
                'auth/invalid-credential': 'Invalid email or password.',
                'auth/network-request-failed': 'Network error. Please check your connection.',
            };

            const displayError = errorMessages[error.code] || error.message || 'Login failed. Please try again.';
            showLoginStatus('error', displayError);

            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
            isProcessingLogin = false;
        }
    }

    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('password');
        const toggleBtn = document.querySelector('.password-toggle');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleBtn.textContent = 'Hide';
            toggleBtn.setAttribute('aria-pressed', 'true');
        } else {
            passwordInput.type = 'password';
            toggleBtn.textContent = 'Show';
            toggleBtn.setAttribute('aria-pressed', 'false');
        }
    }

    function showLoginStatus(type, message) {
        const statusElement = document.getElementById('loginStatus');
        statusElement.className = `login-status ${type}`;
        statusElement.textContent = message;
        statusElement.style.display = 'block';

        if (type === 'success') {
            setTimeout(() => {
                statusElement.style.display = 'none';
            }, 4000);
        }
    }

    function hideLoginStatus() {
        const statusElement = document.getElementById('loginStatus');
        statusElement.style.display = 'none';
    }
</script>

</body>

</html>
