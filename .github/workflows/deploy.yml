name: Deploy to lionsfundraising.com

# Pushing to main publishes public_html over FTPS.
#
# READ THIS BEFORE THE FIRST REAL RUN
#
# This action SYNCS. Anything on the server that is not in this repository and
# not excluded below WILL BE DELETED. DRY_RUN starts as "true": the first run
# changes nothing and prints exactly what it would add, change and delete.
# Read that list before setting it to "false".
#
# This property carries live money screens (/payouts, /treasurer) and has no
# PHP and no conformance checker, so there is less standing between a bad push
# and production here than on lionssports.club. Take the dry run seriously.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-lionsfundraising
  cancel-in-progress: false

env:
  DRY_RUN: "false"

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Static HTML with inline modules and no build. The shape checks below
      # are not a proof; the money gates further down are. Those run the suites
      # in _tools/payout, which slice the formula and the check chain out of the
      # shipped pages, so a push that changes what a volunteer is paid, or what
      # the pages say about a Sodexo check, cannot reach production quietly.
      - name: No private keys or service accounts in client code
        run: |
          # A Firebase web apiKey (AIza...) is NOT a secret. It is a public
          # project identifier, it is meant to ship in client code, and every
          # page here carries one. Failing on it would block every deploy.
          # What must never ship is a private key or a service account.
          if grep -rInE '(-----BEGIN [A-Z ]*PRIVATE KEY|"type"[[:space:]]*:[[:space:]]*"service_account")' \
               public_html --include='*.html' --include='*.js' --include='*.json' ; then
            echo "::error::A private key or service account is present in client code."
            exit 1
          fi
          echo "no private keys or service accounts found"

      - name: One Firebase project across the client
        run: |
          # /claims carried projectId "lions-fundraising" while the rest of the
          # site runs on "lionsfundraising-1f854" through lions-auth.js. Two
          # projects means two databases and two sets of security rules, and
          # only one of them is the one in firebase/firestore.rules.
          # DOCUMENTED EXCEPTION: claims/ is shelved as of 2026-08-31 and still
          # carries the old "lions-fundraising" project. It is excluded here so
          # the guard keeps working for every live page instead of being
          # deleted outright. Remove this exclusion when /claims is retired,
          # and do not add a second name to it: the whole point is that a NEW
          # divergence still fails the build.
          ids=$(grep -rhoE 'projectId:[[:space:]]*"[^"]+"' public_html \
                  --include='*.html' --include='*.js' \
                  --exclude-dir=claims | sort -u)
          echo "$ids"
          n=$(echo "$ids" | grep -c .)
          if [ "$n" -gt 1 ]; then
            echo "::error::More than one Firebase projectId in client code."
            exit 1
          fi

      - name: Firestore rules are present and non-empty
        run: |
          test -s firebase/firestore.rules \
            || { echo "::error::firebase/firestore.rules is missing or empty."; exit 1; }
          echo "rules present, $(wc -l < firebase/firestore.rules) lines"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # THE MONEY GATES. Each one extracts the real functions out of
      # public_html and runs them, so none of this can pass against a copy.
      #
      #   check   the formula still does what it did          (regression)
      #   pages   payouts and treasurer still agree           (the two copies)
      #   adr     the formula does what ADR-005 says           (specification)
      #   checks  each event stands alone, and the $1,417.13 is still seen
      #
      # adr was failing from 2026-09-02 until the shirt split was corrected on
      # 2026-09-16. It passes now, and it is a gate now, so it stays passing.
      - name: Payout formula, regression against the goldens
        run: node _tools/payout/run.mjs check

      - name: Payout formula, the two page copies agree
        run: node _tools/payout/run.mjs pages

      - name: Payout formula, conforms to ADR-005
        run: node _tools/payout/run.mjs adr

      - name: Check-received chain, both pages
        run: node _tools/payout/checks.mjs

  # THE RULES GATE. Every gate above tests arithmetic, and on 2026-09-26 all of
  # them were green while the treasurer could not save a thing (M-30), because
  # the Firestore rules decide permission and nothing tested them. This signs in
  # to the Firestore emulator AS THE TREASURER, reads the keys her buttons write
  # out of the shipped page, and fails if the rules in firebase/firestore.rules
  # would deny any of them. It does not deploy the rules; that is still done by
  # hand from the committed file.
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install the emulator tooling, pinned
        working-directory: _tools/rules
        run: npm install --no-save --no-audit --no-fund firebase-tools@15.31.0 @firebase/rules-unit-testing@5.0.2 firebase@12.19.0

      - name: Firestore rules, as the treasurer
        working-directory: _tools/rules
        run: >
          npx firebase emulators:exec --only firestore --project demo-lions
          "node rules-test.mjs ../../firebase/firestore.rules ../../public_html/treasurer/index.html"

  deploy:
    needs: [checks, rules]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Publish over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./public_html/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          dry-run: ${{ env.DRY_RUN }}
          log-level: standard
          # "Server sent FIN packet unexpectedly" on 2026-08-31: the host closed
          # the control connection 49 seconds into a 132 file first publish.
          # Shared hosting commonly drops a connection that has been open and
          # busy for a while. Raising the per-operation timeout from the 30s
          # default gives the client room to wait out a slow response instead of
          # treating it as dead.
          timeout: 120000
          exclude: |
            **/.DS_Store
            **/Thumbs.db
            **/desktop.ini
            **/.ftp-deploy-sync-state.json
